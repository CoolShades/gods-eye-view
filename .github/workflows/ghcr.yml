name: Build & push image (ghcr)

# Fork-only workflow. Upstream (bilawalsidhu/gods-eye-view) publishes no
# container image, so this builds one from upstream main using upstream's own
# Dockerfile and pushes it to ghcr.io/coolshades/gods-eye-view.
#
# It checks out UPSTREAM directly, so this fork never needs syncing: the only
# thing the fork carries is this file. A nightly run rebuilds only when the
# upstream main SHA has no image yet. Flux image automation in fleet-infra
# watches the `latest` digest and rolls the deployment.

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this upstream SHA already has an image"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/ghcr.yml"]

concurrency:
  group: ghcr-build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/coolshades/gods-eye-view
  UPSTREAM: bilawalsidhu/gods-eye-view

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve upstream main
        id: up
        run: |
          sha=$(git ls-remote "https://github.com/${UPSTREAM}.git" refs/heads/main | cut -f1)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:8}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already built
        id: check
        run: |
          if [ "${{ inputs.force }}" != "true" ] && \
             docker buildx imagetools inspect "${IMAGE}:up-${{ steps.up.outputs.short }}" >/dev/null 2>&1; then
            echo "Image for upstream ${{ steps.up.outputs.short }} exists; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream
        if: steps.check.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.up.outputs.sha }}

      - name: Set up buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:up-${{ steps.up.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.up.outputs.sha }}
            org.opencontainers.image.description=God's Eye View (upstream ${{ env.UPSTREAM }}), built for fleet-infra
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
